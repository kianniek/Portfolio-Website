<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gefelicteerd met je verjaardag!</title>
  <link rel="stylesheet" href="Assets/style.css">
  <!-- Externe code voor de Confetti animatie -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
  <div class="verjaardags-kaart">
    <h1>Gefelicteerd! 🎉</h1>

    <div class="foto-container" id="foto-container" style="display: none;">
      <!-- Dit gebruikt de foto uit de Assets folder -->
      <img id="verjaardags-foto" src="" alt="De Jarige" class="verjaardags-foto">
    </div>

    <!-- Verander deze naam en leeftijd -->
    <h2 id="naam-leeftijd"></h2>

    <p class="bericht">Maak er een fantastische dag van!</p>

    <button id="confetti-knop">🎉 Vier Feest! 🎈</button>
  </div>

  <script src="Assets/index.js"></script>
</body>

</html>
