name: Deploy Portfolio Website via Git Pull

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Hard Reset and Sync with Origin
        run: |
          cd /var/www/kianhamidi.com/public_html/
          git fetch origin master
          git reset --hard origin/master
          git clean -fd
          git submodule sync --recursive
          git submodule update --init --recursive